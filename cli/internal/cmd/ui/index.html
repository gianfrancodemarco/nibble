<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nibble</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="top">
  <span class="brand">nibble<span class="bite"></span></span>
  <span id="plate-title">loading…</span>
  <span id="plate-meta" class="meta"></span>
  <span class="spacer"></span>
  <span id="progress" class="meta"></span>
</header>
<div id="notice" hidden></div>

<div id="main">
<aside id="legend" aria-label="keyboard shortcuts">
  <div class="krow"><kbd>← →</kbd><span>previous / next nibble</span></div>
  <div class="krow"><kbd>⏎</kbd><span>pin the typed comment to this nibble</span></div>
  <div class="krow"><kbd>s</kbd><span>send the review, once a verdict is chosen</span></div>
  <div class="krow"><kbd>esc</kbd><span>close the drawer</span></div>
  <div class="krow"><kbd>?</kbd><span>pin this legend open</span></div>
  <p class="kfoot">Refs open the code drawer. Verdicts only select — <b>send review</b> is what ends the agent's wait.</p>
</aside>

<main id="canvas">
  <div id="strip"></div>
</main>
</div>

<nav id="stepper">
  <button id="prev" title="previous nibble (←)">←</button>
  <span id="pos" class="meta"></span>
  <button id="next" title="next nibble (→)">→</button>
</nav>

<aside id="drawer" hidden>
  <header>
    <span id="drawer-path" class="mono"></span>
    <span id="drawer-trust" class="trust"></span>
    <span class="spacer"></span>
    <button id="drawer-close" title="close the drawer (esc)">×</button>
  </header>
  <div id="drawer-note" class="meta" hidden></div>
  <pre id="drawer-code" class="mono"></pre>
</aside>

<footer id="reviewbar">
  <div id="pending"></div>
  <div class="row">
    <input id="comment" type="text" placeholder="comment on this nibble…" title="type, then ⏎ or the pin button attaches it to the active nibble">
    <button id="comment-add" title="pin the comment to the active nibble (⏎)">pin to <span id="comment-target">n1</span></button>
    <span class="spacer"></span>
    <button class="verdict" data-verdict="approve" title="choose a verdict — nothing is sent until you press send review">approve</button>
    <button class="verdict" data-verdict="changes" title="choose a verdict — nothing is sent until you press send review">request changes</button>
    <button class="verdict" data-verdict="question" title="choose a verdict — nothing is sent until you press send review">question</button>
    <button class="verdict" data-verdict="closed" title="choose a verdict — nothing is sent until you press send review">close</button>
    <button id="send" disabled title="send the review and wake the agent (s)">send review</button>
  </div>
  <div id="submitted" hidden></div>
</footer>

<script src="app.js"></script>
</body>
</html>
