name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: cli/go.sum
      - run: go vet ./...
      - run: go test ./... -count=1

  # The committed reader bundle and generated visual types must match their
  # sources (TypeScript and protocol/schemas).
  reader-drift:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reader
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: reader/package-lock.json
      - run: npm ci
      - run: npm run gen
      - run: npm test
      - run: npm run build
      - run: git diff --exit-code ../cli/internal/cmd/ui/app.js src/visual/types.gen.d.ts
