name: Release

# Pushing a v* tag builds the CLI for macOS and Linux and drafts the GitHub
# release with the binaries attached. The draft is published by hand, after
# writing the release notes.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: cli/go.sum
      - name: Build binaries
        working-directory: cli
        run: |
          mkdir -p dist
          for t in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64; do
            GOOS=${t%/*} GOARCH=${t#*/} CGO_ENABLED=0 \
              go build -trimpath -ldflags="-s -w" \
              -o "dist/nibble-${t%/*}-${t#*/}" ./cmd/nibble
          done
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft \
            --title "$GITHUB_REF_NAME" --generate-notes cli/dist/*
