<svg xmlns="http://www.w3.org/2000/svg" width="880" height="540" viewBox="0 0 880 540" role="img" aria-label="The nibble reader: a service map of checkout-api, price cache and postgres above a scrubbable timeline of the cache stampede; a caption below, and the code drawer open at the TTL lines">
  <defs>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.1" fill="#ece6dc"/>
    </pattern>
    <style>
      .sans { font-family: ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif; }
      .mono { font-family: ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
      .txt { fill: #2a2622; } .mut { fill: #7a7166; }
    </style>
  </defs>

  <!-- card -->
  <rect x=".75" y=".75" width="878.5" height="538.5" rx="16" fill="#fffdf9" stroke="#e6dfd4" stroke-width="1.5"/>

  <!-- chrome -->
  <path d="M1 16 Q1 1 17 1 H863 Q879 1 879 16 V46 H1 Z" fill="#f7f3ed"/>
  <line x1="1" y1="46" x2="879" y2="46" stroke="#e6dfd4"/>
  <circle cx="24" cy="23" r="5.5" fill="#e6dfd4"/><circle cx="41" cy="23" r="5.5" fill="#e6dfd4"/><circle cx="58" cy="23" r="5.5" fill="#e6dfd4"/>
  <text class="sans txt" x="78" y="28" font-size="13.5" font-weight="600">Why checkout slows down every hour</text>
  <rect x="580" y="20" width="26" height="7" rx="3.5" fill="#e8590c" opacity=".45"/>
  <rect x="612" y="20" width="40" height="7" rx="3.5" fill="#e8590c"/>
  <rect x="658" y="20" width="26" height="7" rx="3.5" fill="#e6dfd4"/>
  <rect x="690" y="20" width="26" height="7" rx="3.5" fill="#e6dfd4"/>
  <text class="mono mut" x="736" y="28" font-size="12">2/4 · main@4f2a91c</text>

  <!-- canvas -->
  <rect x="1" y="47" width="878" height="283" fill="url(#grid)"/>
  <rect x="16" y="58" width="196" height="24" rx="12" fill="#fffdf9" stroke="#e6dfd4"/>
  <text class="sans mut" x="28" y="74" font-size="12">timeline · <tspan fill="#e8590c" font-weight="700">847</tspan> db queries/s</text>

  <!-- edges -->
  <line x1="250" y1="127" x2="370" y2="127" stroke="#7a7166" stroke-width="2.5"/>
  <text class="mono mut" x="278" y="116" font-size="11">getPrice</text>
  <line x1="530" y1="127" x2="650" y2="127" stroke="#d9480f" stroke-width="7" stroke-dasharray="6 6"/>
  <text class="mono" x="568" y="112" font-size="11" fill="#d9480f">miss</text>

  <!-- nodes -->
  <rect x="90" y="92" width="160" height="70" rx="12" fill="#fffdf9" stroke="#e6dfd4" stroke-width="1.5"/>
  <text class="sans txt" x="110" y="122" font-size="14" font-weight="600">checkout-api</text>
  <text class="mono mut" x="110" y="144" font-size="11">src/api/checkout.ts</text>
  <rect x="370" y="92" width="160" height="70" rx="12" fill="#fffdf9" stroke="#1c6fb0" stroke-width="2.5"/>
  <text class="sans txt" x="390" y="122" font-size="14" font-weight="600">price cache</text>
  <text class="mono mut" x="390" y="144" font-size="11">ttl 3600s</text>
  <rect x="650" y="92" width="160" height="70" rx="12" fill="#fbe9e2" stroke="#d9480f" stroke-width="2.5"/>
  <text class="sans txt" x="670" y="122" font-size="14" font-weight="600">postgres</text>
  <text class="mono" x="670" y="144" font-size="11" fill="#d9480f">pool 20 · saturated</text>

  <!-- chart -->
  <g transform="translate(90,196)">
    <line x1="0" y1="110" x2="720" y2="110" stroke="#e6dfd4" stroke-width="1.5"/>
    <line x1="0" y1="30" x2="720" y2="30" stroke="#d9480f" stroke-dasharray="4 4" opacity=".7"/>
    <text class="mono" x="616" y="24" font-size="11" fill="#d9480f">pool limit</text>
    <rect x="8"   y="98" width="8" height="12" fill="#e8590c" opacity=".45"/>
    <rect x="58"  y="100" width="8" height="10" fill="#e8590c" opacity=".45"/>
    <rect x="108" y="97" width="8" height="13" fill="#e8590c" opacity=".45"/>
    <rect x="158" y="100" width="8" height="10" fill="#e8590c" opacity=".45"/>
    <rect x="208" y="98" width="8" height="12" fill="#e8590c" opacity=".45"/>
    <rect x="252" y="99" width="8" height="11" fill="#e8590c" opacity=".45"/>
    <rect x="284" y="6"  width="8" height="104" fill="#d9480f"/>
    <rect x="294" y="38" width="8" height="72" fill="#d9480f"/>
    <rect x="304" y="66" width="8" height="44" fill="#d9480f"/>
    <rect x="314" y="92" width="8" height="18" fill="#e8590c" opacity=".7"/>
    <rect x="364" y="98" width="8" height="12" fill="#e8590c" opacity=".45"/>
    <rect x="414" y="100" width="8" height="10" fill="#e8590c" opacity=".45"/>
    <rect x="464" y="97" width="8" height="13" fill="#e8590c" opacity=".45"/>
    <rect x="514" y="100" width="8" height="10" fill="#e8590c" opacity=".45"/>
    <rect x="564" y="98" width="8" height="12" fill="#e8590c" opacity=".45"/>
    <rect x="614" y="100" width="8" height="10" fill="#e8590c" opacity=".45"/>
    <rect x="664" y="98" width="8" height="12" fill="#e8590c" opacity=".45"/>
    <line x1="300" y1="-8" x2="300" y2="114" stroke="#2a2622" stroke-width="1.5"/>
    <circle cx="300" cy="114" r="5" fill="#2a2622"/>
    <text class="mono mut" x="0" y="128" font-size="11">11:58</text>
    <text class="mono mut" x="276" y="128" font-size="11">12:00</text>
    <text class="mono mut" x="692" y="128" font-size="11">12:03</text>
  </g>

  <!-- controls -->
  <line x1="1" y1="330" x2="879" y2="330" stroke="#e6dfd4"/>
  <circle cx="36" cy="354" r="14" fill="#fffdf9" stroke="#e6dfd4" stroke-width="1.5"/>
  <path d="M32 347 L43 354 L32 361 Z" fill="#2a2622"/>
  <rect x="66" y="350" width="560" height="8" rx="4" fill="#e6dfd4"/>
  <rect x="66" y="350" width="230" height="8" rx="4" fill="#e8590c"/>
  <circle cx="296" cy="354" r="9" fill="#e8590c" stroke="#fffdf9" stroke-width="2.5"/>
  <text class="mono txt" x="646" y="359" font-size="13">12:00:03</text>
  <rect x="724" y="340" width="140" height="28" rx="14" fill="#fffdf9" stroke="#e6dfd4" stroke-width="1.5"/>
  <rect x="724" y="340" width="78" height="28" rx="14" fill="#2a2622"/>
  <text class="sans" x="763" y="358" font-size="11.5" font-weight="600" fill="#fffdf9" text-anchor="middle">jitter off</text>
  <text class="sans mut" x="832" y="358" font-size="11.5" text-anchor="middle">on</text>

  <!-- caption -->
  <line x1="1" y1="378" x2="879" y2="378" stroke="#e6dfd4"/>
  <text class="sans" x="24" y="400" font-size="11" font-weight="700" letter-spacing="1" fill="#e8590c">NIBBLE 2</text>
  <rect x="236" y="404" width="98" height="23" rx="3" fill="#fff1c2"/>
  <rect x="236" y="425" width="98" height="2.5" fill="#f0b429"/>
  <text class="sans txt" x="24" y="421" font-size="16.5">Every cached price expires <tspan font-weight="600">on the hour</tspan>, so every miss hits Postgres at once.</text>

  <!-- drawer -->
  <path d="M1 436 H879 V523 Q879 539 863 539 H17 Q1 539 1 523 Z" fill="#fbf8f3"/>
  <line x1="1" y1="436" x2="879" y2="436" stroke="#e6dfd4"/>
  <text class="mono mut" x="24" y="458" font-size="12">▾  src/cache/prices.ts · 43–45</text>
  <rect x="240" y="444" width="48" height="18" rx="4" fill="#e3f1e5"/>
  <text class="sans" x="264" y="457" font-size="10.5" font-weight="600" fill="#2f9e44" text-anchor="middle">exact</text>
  <text class="sans mut" x="856" y="458" font-size="11" text-anchor="end">press c to comment</text>
  <rect x="1" y="470" width="878" height="22" fill="#fff1c2"/><rect x="1" y="470" width="3.5" height="22" fill="#f0b429"/>
  <rect x="1" y="492" width="878" height="22" fill="#fff1c2"/><rect x="1" y="492" width="3.5" height="22" fill="#f0b429"/>
  <text class="mono mut" x="48" y="485" font-size="12.5" text-anchor="end" opacity=".6">43</text>
  <text class="mono txt" x="62" y="485" font-size="12.5"><tspan fill="#b5317a">await</tspan> cache.<tspan fill="#1c6fb0">set</tspan>(<tspan fill="#2f8a4c">`price:${sku}`</tspan>, price, {</text>
  <text class="mono mut" x="48" y="507" font-size="12.5" text-anchor="end" opacity=".6">44</text>
  <text class="mono txt" x="62" y="507" font-size="12.5">  ttl: <tspan fill="#b35c00">3600</tspan>, <tspan fill="#9a9086" font-style="italic">// same for every key, no jitter</tspan></text>
  <text class="mono mut" x="48" y="529" font-size="12.5" text-anchor="end" opacity=".6">45</text>
  <text class="mono txt" x="62" y="529" font-size="12.5">})</text>
</svg>
